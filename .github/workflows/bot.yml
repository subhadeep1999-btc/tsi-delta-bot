name: tsi-bot

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "once = normal run, check = read-only test, test-order = demo order test"
        default: "once"
        type: choice
        options:
          - once
          - check
          - test-order
          - status

concurrency:
  group: tsi-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run the bot
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          DELTA_PROXY: ${{ secrets.DELTA_PROXY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ vars.MODE }}
          LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM }}
          CAPITAL_INR: ${{ vars.CAPITAL_INR }}
          INR_PER_USD: ${{ vars.INR_PER_USD }}
          WALLET_ASSET: ${{ vars.WALLET_ASSET }}
          BOT_PAUSE: ${{ vars.BOT_PAUSE }}
          FULL_BUDGET: ${{ vars.FULL_BUDGET }}
          MAX_LEVERAGE: ${{ vars.MAX_LEVERAGE }}
        run: python tsi_bot.py --${{ inputs.cmd || 'once' }}

      - name: Save bot memory
        if: always()
        run: |
          git config user.name "tsi-bot"
          git config user.email "tsi-bot@users.noreply.github.com"
          for f in bot_state.json trades_log.csv; do [ -f "$f" ] && git add -f "$f"; done || true
          git commit -m "bot state" || echo "nothing to save"
          git pull --rebase || true
          git push || true
